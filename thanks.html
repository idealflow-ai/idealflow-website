<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報名完成｜匯成交 iDealFlow.ai 免費實體講座</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<section class="ty">
  <div class="wrap">
    <div class="tick">✓</div>

    <div class="bk2-steps" style="padding-top:0;margin-bottom:26px">
      <span class="bk2-step" style="color:rgba(255,255,255,.5)"><span class="n" style="background:rgba(255,255,255,.18);color:#fff">✓</span>填寫報名資料</span>
      <span class="bk2-sep" style="background:rgba(255,255,255,.25)"></span>
      <span class="bk2-step on" style="color:#fff"><span class="n">2</span>收到地點提醒</span>
    </div>

    <h1 id="tyTitle">報名<span>完成</span>！</h1>
    <p class="ty-sub">座位已經幫你留好，接下來只要等地點提醒。</p>

    <div class="ty-card">
      <div class="ty-row"><span class="k">講座時間</span><span class="v" id="tySession">10/3（六）14:00－19:00</span></div>
      <div class="ty-row"><span class="k">講座地點</span><span class="v">台北市南京東路四段51-2號3樓</span></div>
      <div class="ty-row"><span class="k">費用</span><span class="v">完全免費</span></div>
    </div>

    <div class="ty-card ty-next">
      <h4>接下來會發生什麼？</h4>
      <ul>
        <li><span class="no">1</span><span>我們會用你留下的<b style="color:#fff">電話或 Email</b> 把地點與交通資訊傳給你。</span></li>
        <li><span class="no">2</span><span>開講前會再提醒你一次，記得留意通知。</span></li>
        <li><span class="no">3</span><span>當天請提前 10 分鐘到現場報到、入座。</span></li>
      </ul>
    </div>

    <div class="hero-ctas">
      <a class="btn btn-primary" href="start.html">先看看 14 天啟動計畫 <span class="arr">→</span></a>
      <a class="btn btn-ghost" href="index.html">回官網</a>
    </div>

    <p class="ty-foot">沒收到通知？來信 <a href="mailto:arther.learn@gmail.com" style="color:var(--orange)">arther.learn@gmail.com</a>，我們幫你確認。</p>
  </div>
</section>

<script>
const q = new URLSearchParams(location.search);
const name = (q.get('n') || '').slice(0, 30);
const session = (q.get('s') || '').slice(0, 40);
if (name) {
  const h = document.getElementById('tyTitle');
  h.textContent = name + '，報名';
  const em = document.createElement('span'); em.textContent = '完成';
  h.append(em, document.createTextNode('！'));
}
if (session) document.getElementById('tySession').textContent = session;
</script>
</body>
</html>
